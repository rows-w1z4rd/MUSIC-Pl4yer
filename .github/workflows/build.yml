# Builds a signed APK and publishes it as a GitHub Release, so it can be installed straight
# from the phone. It only runs when started by hand ("Run workflow" on the Actions tab, or
# `gh workflow run build.yml`): day-to-day testing happens in the Android Studio emulator.
name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The version comes from gradle.properties, the same place the app reads it from.
      # Stops right away if that version was already released.
      - name: Read the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Raise appVersion in gradle.properties, then re-run this workflow."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Matches gradle/gradle-daemon-jvm.properties, so Gradle doesn't download its own JDK.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SUNAPLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The signing key secrets are missing. Add the four SUNAPLAY_* secrets in the repository settings, then re-run this workflow."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SUNAPLAY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SUNAPLAY_KEYSTORE_PASSWORD: ${{ secrets.SUNAPLAY_KEYSTORE_PASSWORD }}
          SUNAPLAY_KEY_ALIAS: ${{ secrets.SUNAPLAY_KEY_ALIAS }}
          SUNAPLAY_KEY_PASSWORD: ${{ secrets.SUNAPLAY_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="MU51C-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          git log -1 --format='%s%n%n%b' > notes.txt
          gh release create "v$VERSION" "$apk" \
            --title "MU51C $VERSION" \
            --notes-file notes.txt \
            --target "$GITHUB_SHA" \
            --latest

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
